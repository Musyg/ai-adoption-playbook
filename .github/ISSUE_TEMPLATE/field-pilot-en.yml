name: Propose a field pilot
description: Open a public, non-identifying intake before collecting or sharing any evidence.
title: "[Field pilot]: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        ## Public intake only — no raw evidence

        This issue coordinates a possible pilot. It is **not** a field report and cannot validate the playbook.

        Do not include client or organization names, personal data, secrets, contracts, raw prompts, logs, screenshots, privileged material, or exploitable security details.

  - type: input
    id: alias
    attributes:
      label: Non-identifying alias
      description: Use a neutral project name that cannot identify a person, client, or organization.
      placeholder: Workshop North
    validations:
      required: true

  - type: dropdown
    id: organization
    attributes:
      label: Organization path
      options:
        - Independent professional
        - Micro-business
        - SME
        - Nonprofit or foundation
        - Public service
    validations:
      required: true

  - type: dropdown
    id: use_pattern
    attributes:
      label: AI use pattern
      description: Choose the main job the system performs. This is separate from autonomy and integration level.
      options:
        - Assisted generation
        - Controlled retrieval or RAG
        - Classification or extraction
        - Prediction or scoring
        - External conversation or chatbot
        - Multimodal processing
        - Agentic action
        - Not decided
    validations:
      required: true

  - type: dropdown
    id: integration
    attributes:
      label: Intended integration level
      options:
        - Copilot A0–A1
        - Business agent A2–A3
        - Orchestrated agency A3–A4
        - Not decided
    validations:
      required: true

  - type: dropdown
    id: jurisdiction
    attributes:
      label: Main territory
      description: Choose where the workflow is operated or where affected people are located.
      options:
        - Switzerland
        - European Union
        - Switzerland and European Union
    validations:
      required: true

  - type: dropdown
    id: sector
    attributes:
      label: Sector overlay
      options:
        - General or cross-sector
        - Healthcare
        - Education
        - Finance
        - Critical infrastructure
    validations:
      required: true

  - type: dropdown
    id: readiness
    attributes:
      label: Current stage
      options:
        - Problem and baseline being defined
        - Offline evaluation ready or running
        - Shadow pilot ready or running
        - Bounded live pilot ready or running
        - Existing system available for retrospective review
    validations:
      required: true

  - type: dropdown
    id: planning_basis
    attributes:
      label: Preregistered planning basis
      description: Choose how the low, central, and high hypothesis will be created before field results are read.
      options:
        - Comparable public source through the transfer engine
        - Editable local human-time hypothesis
        - Not framed yet
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: One bounded workflow
      description: Describe the input, accepted outcome, human decision, and excluded work without identifying the organization.
      placeholder: From a generic inbound request to a reviewed draft; sending and contractual decisions remain human.
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Decision the pilot should inform
      description: State the concrete continue, rework, or stop decision this pilot should support.
    validations:
      required: true

  - type: checkboxes
    id: safeguards
    attributes:
      label: Public-boundary confirmation
      options:
        - label: I included no identity, personal data, confidential material, secret, raw evidence, or exploitable security detail.
          required: true
        - label: I understand this issue is coordination metadata, not evidence, approval, or a published field result.
          required: true
        - label: I will keep raw evidence in an authorized private system and submit only a separately reviewed, anonymized report if publication is appropriate.
          required: true
        - label: I can name a local evidence owner, an independent reviewer, and a publication authority before any report is admitted.
          required: true
