version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Keep React runtime peers together across dependencies/devDependencies.
      react-stack-minor-patch:
        patterns:
          - "react"
          - "react-dom"
          - "react-server-dom-webpack"
          - "@types/react"
          - "@types/react-dom"
          - "vinext"
          - "@vitejs/plugin-react"
          - "@vitejs/plugin-rsc"
        update-types:
          - minor
          - patch
      react-stack-security:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
          - "react-server-dom-webpack"
          - "@types/react"
          - "@types/react-dom"
          - "vinext"
          - "@vitejs/plugin-react"
          - "@vitejs/plugin-rsc"
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Zurich
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
