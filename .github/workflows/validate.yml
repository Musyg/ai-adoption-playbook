name: Validate playbook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check structure, local links and register schema
        run: |
          python -m unittest discover -s scripts -p test_validate.py
          python scripts/validate.py

  application:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Shipped (production) dependencies must stay free of moderate+ advisories.
      - run: npm audit --omit=dev --audit-level=moderate
      # Full tree, build tooling included. GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7)
      # has no upstream fix yet, so this step reports without blocking.
      # Make it blocking again once picomatch publishes a patched release
      # (see site/DEPENDENCY_SECURITY.md, 18 November 2026).
      - name: Full dependency audit (build tooling, informational)
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: google-chrome --version
      - run: npm run test:browser
