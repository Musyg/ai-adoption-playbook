name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Validate playbook"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure GitHub Pages metadata
        id: pages
        uses: actions/configure-pages@v6
      - name: Install locked dependencies
        working-directory: site
        run: npm ci
      - name: Build the host-ready static site
        working-directory: site
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          STATIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build:static
      - name: Verify hosted paths, metadata and sitemap
        working-directory: site
        run: npm run test:hosted
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/static-dist

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
